name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
      - run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - run: uv run --frozen --python ${{ matrix.python-version }} ruff check .
      - run: uv run --frozen --python ${{ matrix.python-version }} ruff format --check .
      - run: uv run --frozen --python ${{ matrix.python-version }} mypy
      - run: uv run --frozen --python ${{ matrix.python-version }} pytest -p no:cacheprovider
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run format:check
      - run: bun run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
      - run: uv build
      - run: |
          set -e
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "Expected exactly one .whl in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          uv run --isolated --no-project --with "./${wheels[0]}" python -c "import config, main; assert callable(main.main)"
