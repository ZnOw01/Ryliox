name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -p no:cacheprovider
        env:
          PATHS: '{"data_dir":"/tmp/ryliox-data","output_dir":"/tmp/ryliox-output","audit_log_dir":"/tmp/ryliox-data/audit","audit_log_file":"/tmp/ryliox-data/audit.log","secrets_dir":"/tmp/ryliox-data/secrets","secrets_file":"/tmp/ryliox-data/secrets.enc"}'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run format:check
      - run: bun run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
      - run: uv build
      - run: uv run --isolated --no-project --with ./dist/ryliox-2.0.0-py3-none-any.whl python -c "import config, main; assert callable(main.main)"
