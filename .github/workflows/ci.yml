name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.6.0"
          args: "check --output-format=github"
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.6.0"
          args: "format --check"

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run mypy core/ web/ plugins/ launcher/ || true

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --frozen --extra dev --extra security
      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short --color=yes
      - name: Run integration tests (books)
        run: uv run pytest tests/integration/api/test_books.py -v --tb=short --color=yes
      - name: Run integration tests (auth)
        run: uv run pytest tests/integration/api/test_auth.py -v --tb=short --color=yes -k "not rate_limit"
      - name: Run integration tests (downloads)
        run: uv run pytest tests/integration/api/test_downloads.py -v --tb=short --color=yes -k "not rate_limit"
      - name: Run integration tests (plugins)
        run: uv run pytest tests/integration/plugins/ -v --tb=short --color=yes
        env:
          RYLIOX_DATA_DIR: /tmp/ryliox-test-data
      - name: Upload coverage
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.0"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra security
      - name: pip-audit
        run: uv run pip-audit --strict || true
      - name: Bandit
        run: uv run bandit -r core plugins utils web launcher -c pyproject.toml || true
      - name: Detect secrets
        run: uv run detect-secrets scan --all-files --exclude-files 'tests/|frontend/node_modules|\.git|uv\.lock' || true
