[project]
name = "ryliox"
version = "2.0.0"
description = "Ryliox — O'Reilly Learning Platform book downloader with a FastAPI backend and Astro/React frontend."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryliox contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["oreilly", "downloader", "ebook", "epub", "pdf", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]

dependencies = [
    # ── HTTP & networking ──
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "urllib3>=2.0",
    "certifi>=2024.0",
    "charset-normalizer>=3.3",
    "idna>=3.6",
    "fake-useragent>=2.0.0",
    # ── HTML / scraping ──
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "bleach>=6.1.0",
    # ── Web framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # ── Auth / crypto ──
    "cryptography>=43.0.0",
    "pyjwt>=2.8.0",
    # ── Templating / output ──
    "jinja2>=3.1.0",
    "markdown>=3.6",
    "pillow>=10.0",
    "weasyprint>=60.0",
    "ebooklib>=0.18",
    # ── Metrics / observability ──
    "prometheus-client>=0.21.0",
    "psutil>=6.0.0",
    # ── Config / IO ──
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "types-requests",
    "types-beautifulsoup4",
    "types-PyYAML",
]
e2e = [
    "playwright>=1.48.0",
    "locust>=2.31.0",
]
security = [
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
]
all = [
    "ryliox[dev,e2e,security]",
]

[project.scripts]
ryliox = "main:main"

[project.urls]
Homepage = "https://github.com/ryliox/ryliox"
Documentation = "https://github.com/ryliox/ryliox/blob/main/README.md"
Source = "https://github.com/ryliox/ryliox"
Issues = "https://github.com/ryliox/ryliox/issues"

# ─── uv / build ─────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "plugins", "utils", "web", "launcher"]
include = [
    "config.py",
    "main.py",
]
exclude = [
    "tests",
    "frontend",
    "frontend/**",
    "data",
    "output",
    "node_modules",
    "*.egg-info",
]

# ─── Tooling configs ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "node_modules",
    "frontend",
    "build",
    "dist",
    ".venv",
    "data",
    "output",
    "tests/fixtures",
]
src = ["core", "plugins", "utils", "web"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # use-pathlib
    "ERA",  # eradicate commented-out code
    "PL",   # pylint
]
ignore = [
    "PLR0913",  # too-many-arguments
    "PLR2004",  # magic-value-comparison
    "S101",     # use of assert (OK in tests)
    "E501",     # line-too-long (handled by formatter)
    "PLW0603",  # global-statement (intentional pattern for module-level config)
    "PLR0915",  # too-many-statements
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR1714",  # repeated-equality-comparison
    "PLW1510",  # subprocess-run-without-check (intentional for fire-and-forget)
    "PLW0108",  # unnecessary-lambda
    "PLW2901",  # redefined-loop-name
    "B024",     # abstract-base-class-without-abstract-method
    "B905",     # zip-without-explicit-strict
    "B904",     # raise-without-from-inside-except (refactor churn, not a bug)
    "PT014",    # pytest-duplicate-parametrize-test-cases
    "PT022",    # pytest-useless-yield-fixture
    "TRY002",   # raise-vanilla-class
    "RET504",   # unnecessary-assign
    "S112",     # try-except-continue
    "SIM102",   # collapsible-if
    "SIM103",   # needless-bool
    "SIM108",   # if-else-block-instead-of-if-exp
    "SIM117",   # multiple-with-statements
    "SIM118",   # in-dict-keys
    "E731",     # lambda-assignment
    "PTH101",   # os-chmod
    "PTH123",   # builtin-open (allowed when pathlib equivalent is verbose)
    "S608",     # hardcoded-sql-expression (uses parameterized queries with # nosec)
    "S603",     # subprocess-without-shell-equals-true (intentional, no shell)
    "S607",     # start-process-with-partial-path (intentional in launcher)
    "S110",     # try-except-pass (intentional in some places)
    "PLC0415",  # import-outside-top-level (TYPE_CHECKING, lazy loading)
    "B008",     # function-call-in-default-argument (intentional in some places)
    "E402",     # module-import-not-at-top-of-file (sys.path modifications)
    "S104",     # hardcoded-bind-all-interfaces (Docker 0.0.0.0 default)
    "B007",     # unused-loop-control-variable
    "B018",     # useless-expression (intentional in test)
    "B017",     # assert-raises-exception
    "TC001",    # move-application-imports-into-type-checking-block (Depends types)
]
unfixable = ["ERA001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B011", "B017", "F821", "PLR2004"]
"**/__init__.py" = ["F401", "F403"]
"plugins/*" = ["PLR0913", "B008", "TC003"]
"frontend/**" = ["ALL"]
"launcher/*" = ["PLC0415", "TCH002", "PLR0913"]
"core/http_client.py" = ["TC003"]

[tool.ruff.lint.isort]
known-first-party = ["core", "plugins", "utils", "web", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = ["."]
files = ["core", "plugins", "utils", "web", "main.py"]
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
plugins = ["pydantic.mypy"]
exclude = [
    "build/",
    "dist/",
    "frontend/",
    "node_modules/",
    "tests/fixtures/",
    "data/",
    "output/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--import-mode=importlib",
]
markers = [
    "a11y: accessibility tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "performance: performance / load tests",
    "security: security tests",
    "slow: slow-running tests",
    "rate_limit: rate-limiting related tests",
    "unit: fast unit tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:botocore.*",
    "ignore::DeprecationWarning:curl_cffi.*",
    # Starlette's TestClient warning subclasses UserWarning (not DeprecationWarning),
    # so it must be filtered by its concrete class. The deprecation only concerns
    # using `httpx` instead of `httpx2` for the test client — not a runtime issue.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["core", "plugins", "utils", "web"]
omit = [
    "tests/*",
    "data/*",
    "output/*",
    "frontend/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
precision = 2

[tool.bandit]
exclude_dirs = ["tests", "frontend", "data", "output"]
skips = ["B101"]  # allow assert in src for invariants
include = [
    "config.py",
    "main.py",
]
exclude = [
    "tests",
    "frontend",
    "frontend/**",
    "data",
    "output",
    "node_modules",
    "*.egg-info",
]
