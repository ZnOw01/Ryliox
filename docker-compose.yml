# =============================================================================
# Ryliox - Development Docker Compose
# =============================================================================
# Local dev: builds the image from ./Dockerfile and mounts the backend source.
# The frontend is built into the image; rebuild the image to pick up changes
# under `frontend/`.
# =============================================================================

services:
  ryliox:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ryliox:dev
    container_name: ryliox-dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      # The image binds 0.0.0.0 inside the container; the port is only published on
      # the host's loopback (see above), so the admin token is not required here.
      ENVIRONMENT: development
      ALLOW_UNAUTHENTICATED_LOCAL_PROXY: "true"
      PYTHONDEVMODE: "1"
      LOG_LEVEL: info
      RYLIOX_TRUSTED_HOSTS: "localhost,127.0.0.1,ryliox-dev"

    volumes:
      # Source mounts: restart the container to pick up backend changes.
      - ./core:/app/core
      - ./plugins:/app/plugins
      - ./utils:/app/utils
      - ./web:/app/web
      - ./launcher:/app/launcher
      - ./config.py:/app/config.py
      - ./main.py:/app/main.py
      - ./pyproject.toml:/app/pyproject.toml

      # Persistent runtime state
      - data-dev:/app/data
      - output-dev:/app/output
      - config-dev:/app/.config/ryliox

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data-dev:
  output-dev:
  config-dev:
